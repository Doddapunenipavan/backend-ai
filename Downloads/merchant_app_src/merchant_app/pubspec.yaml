name: flextenure_merchant
description: FlexTenure Merchant Onboarding App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.9.0
  http: ^1.2.2
  archive: ^3.4.0
  google_mlkit_barcode_scanning: ^0.16.1
  # Merchant KYC — camera capture; decode via backend pyaadhaar
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/certs/
